<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Live Trading App - SMC & Price Action</title>
    <style>
        :root {
            --bg-color: #121826;
            --panel-bg: #1e2538;
            --accent-color: #2962ff;
            --danger-color: #ff5252;
            --success-color: #00e676;
            --text-color: #f0f3f8;
            --border-color: #2a3447;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Login Overlay */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 24, 38, 0.95); display: flex; justify-content: center;
            align-items: center; z-index: 1000; padding: 20px;
        }
        .auth-card {
            background: var(--panel-bg); padding: 30px; border-radius: 12px;
            border: 1px solid var(--border-color); width: 100%; max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center;
        }
        .auth-card h2 { margin-bottom: 10px; color: var(--text-color); }
        .auth-card p { font-size: 14px; color: #9598a1; margin-bottom: 20px; }
        .auth-card input {
            width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-color); border-radius: 8px; font-size: 14px; margin-bottom: 15px; outline: none;
        }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--accent-color); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: var(--danger-color); font-size: 13px; margin-top: 10px; display: none; }

        /* App Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            height: 60px; flex-shrink: 0;
        }
        .logo { font-size: 15px; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 5px; }
        .user-info { font-size: 11px; color: #9598a1; display: flex; flex-direction: column; align-items: flex-end; }
        .user-email { color: var(--text-color); font-weight: 500; }
        .btn-group { display: flex; gap: 6px; align-items: center; }
        .action-btn {
            background: var(--border-color); color: var(--text-color); border: none;
            padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;
        }
        .logout-btn { background: var(--danger-color); }

        /* Chart Container - Fixed for Mobile View */
        #chart-container { 
            flex-grow: 1; 
            width: 100%; 
            height: calc(100vh - 60px); 
            position: relative;
        }

        /* Admin Modal */
        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px;
        }
        .admin-card {
            background: var(--panel-bg); width: 100%; max-width: 450px; border-radius: 12px;
            border: 1px solid var(--border-color); padding: 20px; max-height: 80vh; overflow-y: auto;
        }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-admin { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; }
        .user-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .user-row {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .status-active { background: rgba(0, 230, 118, 0.2); color: var(--success-color); }
        .status-inactive { background: rgba(255, 82, 82, 0.2); color: var(--danger-color); }
    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Member Access</h2>
            <p>Enter your registered email to access the live trading chart.</p>
            <input type="email" id="user-email-input" placeholder="your-email@example.com">
            <button onclick="handleLogin()">Verify & Access</button>
            <div id="auth-error" class="error-msg">Access denied or email not authorized.</div>
        </div>
    </div>

    <!-- Main App Header -->
    <header>
        <div class="logo">📊 Pro SMC Live</div>
        <div class="btn-group">
            <div class="user-info">
                <span>User:</span>
                <span id="current-user-display" class="user-email"></span>
            </div>
            <button id="admin-btn" class="action-btn" onclick="openAdminPanel()" style="display:none;">Admin</button>
            <button class="action-btn logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <!-- TradingView Live Widget Container -->
    <div id="chart-container">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container" style="height:100%;width:100%">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
            <script type="text/javascript" src="https://s.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
                "width": "100%",
                "height": "100%",
                "symbol": "OANDA:XAUUSD",
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            }
            </script>
        </div>
        <!-- TradingView Widget END -->
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal">
        <div class="admin-card">
            <div class="admin-header">
                <h3>Admin Control Panel</h3>
                <button class="close-admin" onclick="closeAdminPanel()">&times;</button>
            </div>
            <p style="font-size: 13px; color: #9598a1; margin-bottom: 10px;">Add or remove authorized user emails.</p>
            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <input type="email" id="new-user-email" placeholder="New user email" style="flex-grow: 1; padding: 8px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px;">
                <button onclick="addNewUser()" style="padding: 8px 15px; background: var(--success-color); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Add</button>
            </div>
            <div class="user-list" id="user-list-container"></div>
        </div>
    </div>

    <script>
        const defaultUsers = {
            "lalith@example.com": { active: true, role: "admin" },
            "admin@trading.com": { active: true, role: "admin" },
            "user1@gmail.com": { active: true, role: "user" }
        };

        let dbUsers = JSON.parse(localStorage.getItem('trading_app_users')) || defaultUsers;

        function saveDB() {
            localStorage.setItem('trading_app_users', JSON.stringify(dbUsers));
        }

        window.onload = function() {
            const loggedUser = localStorage.getItem('current_logged_user');
            if (loggedUser && dbUsers[loggedUser] && dbUsers[loggedUser].active) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('current-user-display').innerText = loggedUser;
                if(dbUsers[loggedUser].role === 'admin') {
                    document.getElementById('admin-btn').style.display = 'block';
                }
            }
        };

        function handleLogin() {
            const email = document.getElementById('user-email-input').value.trim().toLowerCase();
            const errorDiv = document.getElementById('auth-error');

            if (dbUsers[email] && dbUsers[email].active) {
                localStorage.setItem('current_logged_user', email);
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('current-user-display').innerText = email;
                if(dbUsers[email].role === 'admin') {
                    document.getElementById('admin-btn').style.display = 'block';
                }
                errorDiv.style.display = 'none';
                location.reload();
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('current_logged_user');
            location.reload();
        }

        function openAdminPanel() {
            document.getElementById('admin-modal').style.display = 'flex';
            renderUserList();
        }

        function closeAdminPanel() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function renderUserList() {
            const container = document.getElementById('user-list-container');
            container.innerHTML = '';
            for (let email in dbUsers) {
                const user = dbUsers[email];
                const row = document.createElement('div');
                row.className = 'user-row';
                row.innerHTML = `
                    <div>
                        <div style="font-size: 13px; font-weight: 500;">${email}</div>
                        <div style="font-size: 11px; color: #9598a1;">Role: ${user.role}</div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span class="status-badge ${user.active ? 'status-active' : 'status-inactive'}">${user.active ? 'Active' : 'Inactive'}</span>
                        ${email !== 'lalith@example.com' ? `<button onclick="toggleUser('${email}')" class="action-btn" style="padding: 4px 8px; font-size: 10px;">Toggle</button>` : ''}
                    </div>
                `;
                container.appendChild(row);
            }
        }

        function addNewUser() {
            const emailInput = document.getElementById('new-user-email');
            const email = emailInput.value.trim().toLowerCase();
            if (email && !dbUsers[email]) {
                dbUsers[email] = { active: true, role: "user" };
                saveDB();
                emailInput.value = '';
                renderUserList();
            }
        }

        function toggleUser(email) {
            if (dbUsers[email]) {
                dbUsers[email].active = !dbUsers[email].active;
                saveDB();
                renderUserList();
            }
        }
    </script>
</body>
</html>
