<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Trading View App</title>
    <!-- TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #121826;
            --panel-bg: #1e2538;
            --accent-color: #2962ff;
            --danger-color: #ff5252;
            --success-color: #00e676;
            --text-color: #f0f3f8;
            --border-color: #2a3447;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Modal & Auth Screen */
        .auth-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.9); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: var(--panel-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid var(--border-color); text-align: center;
        }
        .auth-box h2 { margin-bottom: 20px; color: var(--text-color); }
        .auth-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border-color);
            background: #121826; color: var(--text-color); font-size: 14px;
        }
        .auth-box button {
            width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--accent-color);
            color: white; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .auth-box button:hover { background: #1e4bd8; }
        .error-msg { color: var(--danger-color); font-size: 13px; margin-top: 10px; display: none; }

        /* Main App Layout */
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 25px;
            background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); }
        .controls { display: flex; gap: 10px; align-items: center; }
        button.btn-secondary {
            background: #2a3447; color: var(--text-color); border: none; padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        button.btn-secondary:hover { background: #38455d; }

        .main-content { display: flex; flex: 1; position: relative; }
        #chart-container { flex: 1; height: 100%; }

        /* Admin Panel Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 500;
        }
        .modal-content {
            background: var(--panel-bg); padding: 25px; border-radius: 10px; width: 500px;
            max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        .user-list { margin-top: 15px; list-style: none; }
        .user-item {
            display: flex; justify-content: space-between; align-items: center; padding: 10px;
            background: #121826; margin-bottom: 8px; border-radius: 6px; font-size: 13px;
        }
        .badge-active { color: var(--success-color); font-weight: bold; }
        .badge-inactive { color: var(--danger-color); font-weight: bold; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION SCREEN -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>🔒 Member Access</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Enter your registered email to access the custom indicator chart.</p>
            <input type="email" id="userEmailInput" placeholder="your.email@example.com">
            <button onclick="verifyEmail()">Verify & Access</button>
            <div id="authError" class="error-msg">Access denied or email not registered. Please contact Admin.</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <header>
        <div class="logo">📊 Pro SMC & Price Action Chart</div>
        <div class="controls">
            <span id="loggedInUserDisplay" style="font-size: 13px; color: #94a3b8;"></span>
            <button class="btn-secondary" onclick="openAdminPanel()">⚙️ Admin Panel</button>
            <button class="btn-secondary" onclick="logout()" style="background: #d32f2f;">Logout</button>
        </div>
    </header>

    <div class="main-content">
        <div id="chart-container"></div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>⚙️ User Access Management</h3>
            <p style="font-size: 12px; color: #94a3b8; margin: 5px 0 15px 0;">Add authorized user emails and control their access instantly.</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="email" id="newEmailInput" placeholder="user@gmail.com" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: #121826; color: white;">
                <button onclick="addUser()" style="padding: 8px 15px; background: var(--accent-color); border: none; border-radius: 4px; color: white; cursor: pointer;">Add User</button>
            </div>

            <h4>Registered Users:</h4>
            <ul id="userListUI" class="user-list">
                <!-- Dynamically populated -->
            </ul>
            <button onclick="closeAdminPanel()" class="btn-secondary" style="margin-top: 15px; width: 100%;">Close</button>
        </div>
    </div>

    <script>
        // Default Authorized Users List (LocalStorage synchronized)
        let authorizedUsers = JSON.parse(localStorage.getItem('trading_app_users')) || [
            { email: "admin@trading.com", status: "active" },
            { email: "lalith@example.com", status: "active" }
        ];

        function saveUsers() {
            localStorage.setItem('trading_app_users', JSON.stringify(authorizedUsers));
        }

        // Check if user is already logged in during session
        window.onload = function() {
            const activeUser = sessionStorage.getItem('current_user');
            if (activeUser) {
                const userObj = authorizedUsers.find(u => u.email === activeUser && u.status === 'active');
                if (userObj) {
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('loggedInUserDisplay').innerText = `User: ${userObj.email}`;
                    initChart();
                } else {
                    sessionStorage.removeItem('current_user');
                }
            }
        };

        function verifyEmail() {
            const email = document.getElementById('userEmailInput').value.trim().toLowerCase();
            const errorDiv = document.getElementById('authError');
            
            const user = authorizedUsers.find(u => u.email === email);

            if (user && user.status === 'active') {
                sessionStorage.setItem('current_user', email);
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('loggedInUserDisplay').innerText = `User: ${email}`;
                initChart();
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('current_user');
            location.reload();
        }

        // Initialize TradingView Lightweight Chart
        let chart;
        function initChart() {
            if (chart) return;
            const container = document.getElementById('chart-container');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { color: '#121826' }, textColor: '#f0f3f8' },
                grid: { vertLines: { color: '#1e2538' }, horzLines: { color: '#1e2538' } },
                timeScale: { borderColor: '#2a3447' },
                rightPriceScale: { borderColor: '#2a3447' }
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#00e676', downColor: '#ff5252', borderVisible: false,
                wickUpColor: '#00e676', wickDownColor: '#ff5252'
            });

            // Sample dummy price data for demonstration
            candleSeries.setData([
                { time: '2026-10-25', open: 2700, high: 2740, low: 2690, close: 2730 },
                { time: '2026-10-26', open: 2730, high: 2760, low: 2715, close: 2720 },
                { time: '2026-10-27', open: 2720, high: 2750, low: 2705, close: 2745 },
                { time: '2026-10-28', open: 2745, high: 2780, low: 2730, close: 2770 },
                { time: '2026-10-29', open: 2770, high: 2800, low: 2755, close: 2765 },
                { time: '2026-10-30', open: 2765, high: 2810, low: 2760, close: 2800 }
            ]);

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            });
        }

        // Admin Panel Logic
        function openAdminPanel() {
            const pin = prompt("Enter Admin Security PIN (Default: admin123):");
            if (pin === "admin123") {
                document.getElementById('adminModal').style.display = 'flex';
                renderUserList();
            } else if (pin !== null) {
                alert("Incorrect PIN!");
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function renderUserList() {
            const listUI = document.getElementById('userListUI');
            listUI.innerHTML = '';
            authorizedUsers.forEach((u, index) => {
                listUI.innerHTML += `
                    <li class="user-item">
                        <span>${u.email}</span>
                        <div>
                            <span class="${u.status === 'active' ? 'badge-active' : 'badge-inactive'}">${u.status.toUpperCase()}</span>
                            <button onclick="toggleStatus(${index})" class="btn-secondary" style="padding: 2px 8px; margin-left: 8px;">Toggle</button>
                            <button onclick="deleteUser(${index})" class="btn-secondary" style="padding: 2px 8px; background: #d32f2f; margin-left: 4px;">Delete</button>
                        </div>
                    </li>
                `;
            });
        }

        function addUser() {
            const emailInput = document.getElementById('newEmailInput');
            const email = emailInput.value.trim().toLowerCase();
            if (email && !authorizedUsers.some(u => u.email === email)) {
                authorizedUsers.push({ email: email, status: 'active' });
                saveUsers();
                emailInput.value = '';
                renderUserList();
            } else {
                alert("Invalid email or already exists.");
            }
        }

        function toggleStatus(index) {
            authorizedUsers[index].status = authorizedUsers[index].status === 'active' ? 'inactive' : 'active';
            saveUsers();
            renderUserList();
        }

        function deleteUser(index) {
            authorizedUsers.splice(index, 1);
            saveUsers();
            renderUserList();
        }
    </script>
</body>
</html>
